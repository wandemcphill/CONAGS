name: One-time Conags Care import

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/import-conags-care-once.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out destination repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Copy the standalone Conags Care app
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          curl --fail --location --silent --show-error \
            "https://github.com/wandemcphill/LAUREM/archive/refs/heads/cursor/conags-care-copy-96f4.tar.gz" \
            --output "$work/source.tar.gz"
          mkdir "$work/unpacked"
          tar -xzf "$work/source.tar.gz" -C "$work/unpacked"
          source_root="$(find "$work/unpacked" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          source_app="$source_root/conags-care"
          test -f "$source_app/package.json"

          # Preserve this one-time publisher; copy the app files but not source CI workflows.
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} \;
          find "$source_app" -mindepth 1 -maxdepth 1 ! -name .github -exec cp -a {} . \;
          test -f package.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- . ':!.github' ':!.github/**'
          git commit -m "Publish standalone Conags Care app"
          git push origin HEAD:main
